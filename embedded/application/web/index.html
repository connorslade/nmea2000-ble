<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>windlink</title>
        <style>
            #logs {
                overflow-x: scroll;
            }

            #progress {
                display: none;
                width: 160px;
            }
        </style>
    </head>
    <body>
        <h1>windlink</h1>
        <a href="https://github.com/connorslade/windlink">Source Code</a>

        <h2>Status</h2>
        <pre id="logs"></pre>

        <h2>Firmware Update</h2>
        <p>
            Be careful here, uploading into an invalid image will require
            physical board access to recover from.
        </p>

        <button disabled id="flash">Flash</button>
        <input accept=".bin" id="bin" type="file" /><br /><progress
            id="progress"
            max="100"
            value="0"
        ></progress>
        <p id="message"></p>
    </body>

    <script>
        async function fetchLogs() {
            const res = await fetch("/logs");
            logs.innerText = await res.text();
        }
        fetchLogs();
        const fetchLogsTask = setInterval(fetchLogs, 3000);

        (bin.addEventListener("change", () => {
            flash.disabled = 0 === bin.files.length;
        }),
            flash.addEventListener("click", () => {
                if (!bin.files.length) return alert("No file selected.");
                var e = bin.files[0];
                ((flash.disabled = !0),
                    (progress.style.display = "block"),
                    (progress.value = 0),
                    (message.innerText = "Uploading... 0%"));
                let l = new XMLHttpRequest();
                (l.open("POST", "/update", !0),
                    (l.upload.onprogress = (e) => {
                        e.lengthComputable &&
                            ((e = Math.round((e.loaded / e.total) * 100)),
                            (progress.value = e),
                            (message.innerText = `Uploading... ${e}%`));
                    }),
                    (l.onload = () => {
                        if (200 === l.status) {
                            let e = 10;
                            message.innerText = `Update successful. Reloading in ${e}s...`;
                            const s = setInterval(() => {
                                ((message.innerText = `Update successful. Reloading in ${--e}s...`),
                                    e <= 0 &&
                                        (clearInterval(s), location.reload()));
                            }, 1e3);
                        } else
                            ((message.innerText = "Update failed"),
                                (flash.disabled = !1));
                    }),
                    (l.onerror = () => {
                        ((message.innerText = "Error uploading file"),
                            (flash.disabled = !1));
                    }),
                    l.send(e));
            }));
    </script>
</html>
